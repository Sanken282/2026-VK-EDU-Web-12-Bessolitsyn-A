version: '3.8'

services:
  db:
    image: postgres:18
    container_name: askpupkin_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - askpupkin_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: django_edu_web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./media:/app/media
      - ./static:/app/static
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped
    networks:
      - askpupkin_network

volumes:
  postgres_data:

networks:
  askpupkin_network:
    driver: bridge