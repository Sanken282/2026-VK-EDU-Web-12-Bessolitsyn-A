<!doctype html>
{% extends 'base.html' %}
{% block content %}

<h1>Log In</h1>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-danger" role="alert">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}

    <div class="row align-items-center mb-3">
        <label class="col-2">Login</label>
        <div class="col">
            <input class="form-control" type="text" name="username" placeholder="Enter your login" required>
            <div id="loginFeedback" class="invalid-feedback">Please enter your login</div>
        </div>
    </div>

    <div class="row mb-3">
        <label class="col-2">Password</label>
        <div class="col">
            <input class="form-control" type="password" name="password" placeholder="Enter your password" required>
            <div id="passwordFeedback" class="invalid-feedback">Please enter your password</div>
        </div>
    </div>

    <div class="row mt-2">
        <div class="col offset-2">
            <button type="submit" class="btn btn-primary">Log in!</button>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col offset-2">
            <a href="{% url 'core:signup' %}">Create new account</a>
        </div>
    </div>
</form>

{% endblock %}
